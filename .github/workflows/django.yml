name: SharePlate Django CI
on:
  push:
    branches: [django-migration]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shareplate
          POSTGRES_PASSWORD: shareplate
          POSTGRES_DB: shareplate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shareplate -d shareplate"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Django system checks
        env:
          DATABASE_URL: postgresql://shareplate:shareplate@localhost:5432/shareplate
          DJANGO_SECRET_KEY: ci-only-secret
          DEBUG: 'True'
        run: python manage.py check
      - name: Migration consistency
        env:
          DATABASE_URL: postgresql://shareplate:shareplate@localhost:5432/shareplate
          DJANGO_SECRET_KEY: ci-only-secret
          DEBUG: 'True'
        run: |
          python manage.py makemigrations core --noinput
          python manage.py migrate --noinput
