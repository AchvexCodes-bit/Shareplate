name: SharePlate CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://shareplate:shareplate@localhost:5432/shareplate
          AUTH_SECRET: ci-only-secret
