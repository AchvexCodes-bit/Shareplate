<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SharePlate</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f7f5ef;color:#242622}nav{background:#fff;border-bottom:1px solid #e5e2d9;padding:14px 5%;display:flex;gap:22px;align-items:center}nav a{color:#242622;text-decoration:none}.brand{font-weight:800;margin-right:auto}.wrap{max-width:1100px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border:1px solid #e7e4dc;border-radius:14px;padding:20px;box-shadow:0 4px 18px #00000008}.muted{color:#73756f}.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;background:#3f6b4d;color:#fff;text-decoration:none;cursor:pointer}.danger{background:#a23c35}.msg{padding:12px;border-radius:9px;background:#edf4ed;margin:10px 0}@media(max-width:700px){nav{overflow:auto;white-space:nowrap}.wrap{margin:20px auto}.grid{grid-template-columns:1fr}}</style></head><body><nav><a class="brand" href="{% url 'dashboard' %}">SharePlate</a><a href="{% url 'listings' %}">Food</a><a href="{% url 'courier' %}">Courier</a><a href="{% url 'notifications' %}">Notifications</a><a href="{% url 'impact' %}">Impact</a>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn" type="submit">Sign out</button></form>{% else %}<a class="btn" href="{% url 'login' %}">Sign in</a>{% endif %}</nav><main class="wrap">{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
